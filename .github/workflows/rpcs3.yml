name: CI on Ubuntu ARM64

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Utilisation de l'exécuteur Ubuntu 24.04 ARM natif de GitHub
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Google Chrome arm64 .deb
        run: |
          curl -LO https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb

      - name: Install Google Chrome and Dependencies
        run: |
          sudo apt-get update
          # apt-get install gère automatiquement l'installation des dépendances manquantes locales
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Verify Google Chrome Version
        run: |
          google-chrome --version
